<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射法八節 3D 解剖学ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root {
  --bg-primary: #0d1a2a;
  --bg-secondary: #152238;
  --bg-tertiary: #1e3050;
  --bg-card: #182d48;
  --border: rgba(255,255,255,0.12);
  --border-active: #3a8fd4;
  --text-primary: #e8f0fa;
  --text-secondary: #a0b8d0;
  --text-tertiary: #6a8aaa;
  --accent: #2a7cc7;
  --accent-glow: rgba(42,124,199,0.4);
  --muscle-prime: #e85020;
  --muscle-synergy: #2088d0;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; }

.app { max-width: 520px; margin: 0 auto; padding: 8px; }

/* Header */
.header { text-align: center; padding: 12px 0 8px; }
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.04em; }
.header p { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

/* Step buttons */
.steps { display: flex; gap: 4px; padding: 6px 4px; flex-wrap: wrap; justify-content: center; background: var(--bg-secondary); border-radius: var(--radius) var(--radius) 0 0; border: 0.5px solid var(--border); border-bottom: none; }
.step-btn { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; font-size: 12px; color: var(--text-primary); white-space: nowrap; transition: all 0.2s; font-family: inherit; }
.step-btn:hover { background: var(--bg-tertiary); border-color: rgba(255,255,255,0.25); }
.step-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }

/* 3D Canvas */
.canvas-wrap { position: relative; width: 100%; background: var(--bg-primary); border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }
#canvas3d { display: block; width: 100%; height: 520px; cursor: grab; }
#canvas3d:active { cursor: grabbing; }

.layer-btns { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; }
.layer-btn { padding: 5px 10px; border: 0.5px solid rgba(255,255,255,0.2); border-radius: var(--radius-sm); background: rgba(0,0,0,0.5); cursor: pointer; font-size: 11px; color: rgba(255,255,255,0.65); font-family: inherit; transition: all 0.2s; }
.layer-btn.on { background: rgba(42,124,199,0.6); color: #fff; border-color: var(--border-active); }

.canvas-hint { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255,255,255,0.25); pointer-events: none; }

#loading-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.75); color: #7ab8f5; padding: 12px 20px; border-radius: 8px; font-size: 13px; pointer-events: none; display: none; text-align: center; }

/* Info panel */
.info { width: 100%; background: var(--bg-secondary); border: 0.5px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 12px 14px 14px; }
.pose-name { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.pose-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.6; }

.section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: 5px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Muscle chips */
.muscle-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.muscle-chip { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-primary); background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px 4px 6px; cursor: pointer; transition: all 0.2s; user-select: none; font-family: inherit; }
.muscle-chip:hover { border-color: rgba(255,255,255,0.35); background: var(--bg-tertiary); transform: translateY(-1px); }
.muscle-chip.selected { background: rgba(42,124,199,0.15); border-color: var(--border-active); box-shadow: 0 0 0 1.5px var(--border-active), 0 0 12px var(--accent-glow); color: #fff; }
.chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.chip-role { font-size: 9px; opacity: 0.5; margin-left: 2px; }

/* Bone tags */
.bone-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.bone-tag { font-size: 11px; color: var(--text-secondary); background: var(--bg-tertiary); border-radius: 4px; padding: 3px 8px; cursor: pointer; transition: all 0.2s; user-select: none; border: 0.5px solid transparent; }
.bone-tag:hover { background: #2a4d6a; color: #fff; }
.bone-tag.selected { background: rgba(42,124,199,0.15); border-color: var(--border-active); color: #7ac8f5; box-shadow: 0 0 8px var(--accent-glow); }

.ref-text { font-size: 10px; color: var(--text-tertiary); margin-top: 8px; font-style: italic; }
.hint-text { font-size: 10px; color: rgba(42,124,199,0.6); margin-top: 5px; display: none; }
.hint-text.visible { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>射法八節 3D 解剖学ビューア</h1>
    <p>Kyudo Shahou-Hassetsu Anatomy Viewer</p>
  </div>

  <div class="steps" id="step-buttons"></div>

  <div class="canvas-wrap">
    <canvas id="canvas3d"></canvas>
    <div class="layer-btns">
      <button class="layer-btn on" id="lb-sk" onclick="toggleLayer('sk')">骨格</button>
      <button class="layer-btn on" id="lb-mu" onclick="toggleLayer('mu')">筋肉</button>
    </div>
    <div class="canvas-hint">ドラッグ回転 / スクロールズーム</div>
    <div id="loading-status"></div>
  </div>

  <div class="info">
    <div class="pose-name" id="pose-name"></div>
    <div class="pose-desc" id="pose-desc"></div>
    <div class="section-label">主要筋肉（クリックでフォーカス）</div>
    <div class="muscle-chips" id="muscle-chips"></div>
    <div class="section-label" style="margin-top:10px">解剖学的ポイント</div>
    <div class="bone-tags" id="bone-tags"></div>
    <div class="ref-text" id="ref-text"></div>
    <div class="hint-text" id="hint-text">クリックでフォーカス解除 / 別の筋肉をクリックで切替</div>
  </div>
</div>

// Mouse/Touch controls
let rotY = 0.25, rotX = 0.04, dragging = false, prevX = 0, prevY = 0;
canvas.addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
canvas.addEventListener('touchstart', e => { dragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('touchend', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - prevX) * 0.012;
  rotX += (e.clientY - prevY) * 0.005;
  rotX = Math.max(-0.55, Math.min(0.75, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  rotY += (e.touches[0].clientX - prevX) * 0.012;
  prevX = e.touches[0].clientX;
}, { passive: true });
canvas.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.8, Math.min(6, camera.position.z + e.deltaY * 0.005));
}, { passive: true });

  document.querySelectorAll('.step-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  document.querySelectorAll('.muscle-chip').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.bone-tag').forEach(b => b.classList.remove('selected'));
  document.getElementById('hint-text').classList.remove('visible');

  targetPose = JSON.parse(JSON.stringify(poses[i].a));
  if (Object.keys(currentPose).length === 0) {
    currentPose = JSON.parse(JSON.stringify(targetPose));
  }
  updateUI(i);
  applyMuscleColors();
}

function selectMuscle(name) {
  if (selectedMuscle === name) {
    selectedMuscle = null;
    document.querySelectorAll('.muscle-chip').forEach(c => c.classList.remove('selected'));
    document.getElementById('hint-text').classList.remove('visible');
    applyMuscleColors();
    return;
  }
  selectedMuscle = name;
  selectedBtag = null;
  document.querySelectorAll('.bone-tag').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.muscle-chip').forEach(c => c.classList.remove('selected'));
  const el = document.getElementById('chip-' + name);

  document.getElementById('hint-text').classList.add('visible');
  applyMuscleColors();
}

// ── Muscle vertex coloring ──
function initMuscleVertexColors() {
  if (!muscleMesh) return;
  const geo = muscleMesh.geometry;
  const posAttr = geo.attributes.position;
  const count = posAttr.count;

  musclePositions = [];
  for (let i = 0; i < count; i++) {
    musclePositions.push({
      x: posAttr.getX(i),
      y: posAttr.getY(i),
      z: posAttr.getZ(i)
    });
  }

  // Create vertex color attribute
  const colors = new Float32Array(count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  muscleVertexColors = geo.attributes.color;

  // Set base colors (body default color)
  muscleBaseColors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    muscleBaseColors[i * 3] = 0.65;
    muscleBaseColors[i * 3 + 1] = 0.18;
    muscleBaseColors[i * 3 + 2] = 0.12;
  }

  // Enable vertex colors on material
  muscleMesh.material.vertexColors = true;
  muscleMesh.material.needsUpdate = true;
}

function isVertexInRegion(vx, vy, vz, region) {
  const dx = (vx - region.cx) / region.rx;
  const dy = (vy - region.cy) / region.ry;
  const dz = (vz - region.cz) / region.rz;
  return (dx * dx + dy * dy + dz * dz) <= 1.0;
}

function getVertexMuscleStrength(vx, vy, vz, regions) {
  let maxStrength = 0;
  for (const region of regions) {
    const dx = (vx - region.cx) / region.rx;
    const dy = (vy - region.cy) / region.ry;
    const dz = (vz - region.cz) / region.rz;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist <= 1.0) {
      const strength = 1.0 - dist;
      maxStrength = Math.max(maxStrength, strength);
    }
  }
  return maxStrength;
}

function applyMuscleColors() {
  if (!muscleVertexColors || !musclePositions) return;

  const p = poses[currentStep];
  const activeMuscles = p.muscles;
  const count = musclePositions.length;

  // Determine which muscles are active and their colors
  const activeRegions = [];
  for (const m of activeMuscles) {
    const regions = MUSCLE_REGIONS[m.n];
    if (regions) {
      const colorHex = parseInt(m.c.replace('#', ''), 16);
      const r = ((colorHex >> 16) & 0xFF) / 255;
      const g = ((colorHex >> 8) & 0xFF) / 255;
      const b = (colorHex & 0xFF) / 255;
      activeRegions.push({ name: m.n, regions, r, g, b, role: m.r });
    }
  }

  for (let i = 0; i < count; i++) {
    const vx = musclePositions[i].x;
    const vy = musclePositions[i].y;
    const vz = musclePositions[i].z;

    let bestStrength = 0;
    let bestR = 0, bestG = 0, bestB = 0;
    let isInAnyActive = false;
    let isInSelected = false;
    let selectedStrength = 0;

    for (const ar of activeRegions) {
      const strength = getVertexMuscleStrength(vx, vy, vz, ar.regions);
      if (strength > 0) {
        isInAnyActive = true;
        if (ar.name === selectedMuscle) {
          isInSelected = true;
          selectedStrength = Math.max(selectedStrength, strength);
        }
        if (strength > bestStrength) {
          bestStrength = strength;
          bestR = ar.r;
          bestG = ar.g;
          bestB = ar.b;
        }
      }
    }

    if (selectedMuscle) {
      // A muscle is focused
      if (isInSelected) {
        // This vertex is in the selected muscle - make it bright and vivid
        const intensity = 0.6 + selectedStrength * 0.4;
        const selRegions = MUSCLE_REGIONS[selectedMuscle];
        const selColor = MCOLS[selectedMuscle] || 0xff8844;
        const sr = ((selColor >> 16) & 0xFF) / 255;
        const sg = ((selColor >> 8) & 0xFF) / 255;
        const sb = (selColor & 0xFF) / 255;
        muscleVertexColors.setXYZ(i, sr * intensity, sg * intensity, sb * intensity);
      } else {
        // Not selected muscle - very dim
        muscleVertexColors.setXYZ(i, 0.08, 0.06, 0.06);
      }
    } else if (isInAnyActive) {
      // No muscle selected, but this vertex is in an active muscle region
      const intensity = 0.5 + bestStrength * 0.5;
      muscleVertexColors.setXYZ(i, bestR * intensity, bestG * intensity, bestB * intensity);
    } else {
      // Base body color (non-active region) - slightly dimmer
      muscleVertexColors.setXYZ(i,
        muscleBaseColors[i * 3] * 0.35,
        muscleBaseColors[i * 3 + 1] * 0.35,
        muscleBaseColors[i * 3 + 2] * 0.35
      );
    }
  }

  muscleVertexColors.needsUpdate = true;
}

// ── GLB Loading ──
const STATUS = document.getElementById('loading-status');
function showStatus(msg) { STATUS.style.display = 'block'; STATUS.textContent = msg; }
function hideStatus() { STATUS.style.display = 'none'; }

function findBone(obj, name) {
  if (obj.name === name) return obj;
  for (const c of obj.children) {
    const r = findBone(c, name);
    if (r) return r;
  }
  return null;
}

function applyPoseToGLB(a) {
  for (const [boneName, fn] of Object.entries(BONE_MAP)) {
    if (glbBones[boneName]) fn(glbBones[boneName], a);
  }
}

function loadGLB(url, filename) {
  showStatus('3Dモデル読み込み中...');
  const loader = new THREE.GLTFLoader();
  loader.load(url, (gltf) => {
    if (glbModel) { root.remove(glbModel); glbModel = null; }
    glbModel = gltf.scene;

    // Scale and center
    const box = new THREE.Box3().setFromObject(glbModel);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const scale = 1.70 / size.y;
    glbModel.scale.setScalar(scale);
    glbModel.position.y = -box.min.y * scale;
    glbModel.position.x = -center.x * scale;
    glbModel.position.z = -center.z * scale;

    // Find bones
    for (const boneName of Object.keys(BONE_MAP)) {
      const bone = findBone(glbModel, boneName);
      if (bone) glbBones[boneName] = bone;
    }

    // Process meshes
    glbModel.traverse(obj => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;

        // Identify muscle vs skeleton mesh
        if (obj.name.startsWith('MU_') || (obj.material && obj.material.name && obj.material.name.includes('Muscle'))) {
          muscleMesh = obj;
          obj.userData.layer = 'muscle';
          // Replace material with MeshStandardMaterial for vertex colors
          const oldMat = obj.material;
          obj.material = new THREE.MeshStandardMaterial({
            vertexColors: false,
            transparent: true,
            opacity: oldMat.opacity !== undefined ? Math.max(oldMat.opacity, 0.85) : 0.85,
            roughness: 0.55,
            metalness: 0.02,
            emissive: new THREE.Color(0x000000),
            emissiveIntensity: 0,
            side: THREE.DoubleSide
          });
        } else if (obj.name.startsWith('SK_') || (obj.material && obj.material.name && obj.material.name.includes('Skeleton'))) {
          skeletonMesh = obj;
          obj.userData.layer = 'skeleton';
          const oldMat = obj.material;
          obj.material = new THREE.MeshStandardMaterial({
            color: oldMat.color || new THREE.Color(0xf0ead8),
            transparent: true,
            opacity: oldMat.opacity !== undefined ? Math.max(oldMat.opacity, 0.88) : 0.88,
            roughness: 0.5,
            metalness: 0.05,
            emissive: new THREE.Color(0x000000),
            emissiveIntensity: 0,
            side: THREE.DoubleSide
          });
        } else {
          // Generic mesh - use standard material
          if (!obj.material.emissive) {
            const old = obj.material;
            obj.material = new THREE.MeshStandardMaterial({
              color: old.color || new THREE.Color(0xffffff),
              map: old.map || null,
              transparent: old.transparent || false,
              opacity: old.opacity !== undefined ? old.opacity : 1,
              roughness: 0.6,
              metalness: 0.05,
              emissive: new THREE.Color(0x000000),
              emissiveIntensity: 0
            });
          }
        }
      }
    });

    root.add(glbModel);
    updateLayerVisibility();
    applyPoseToGLB(currentPose);

    // Initialize vertex coloring for muscles
    initMuscleVertexColors();
    applyMuscleColors();

    hideStatus();
    console.log('GLB loaded:', filename, '/ Bones:', Object.keys(glbBones).length);
  },
  (xhr) => {
    if (xhr.total) showStatus('3Dモデル読み込み中... ' + Math.round(xhr.loaded / xhr.total * 100) + '%');
  },
  (err) => { hideStatus(); console.error('GLB load error:', err); }
  );
}

// ── Init & render loop ──
buildStepButtons();
goToStep(0);

// Load GLB model
setTimeout(() => {
  fetch('human_rigged.glb', { method: 'HEAD' })
    .then(r => { if (r.ok) loadGLB('human_rigged.glb', 'human_rigged.glb'); })
    .catch(() => { console.log('human_rigged.glb not found nearby'); });
}, 300);

function lerp(a, b, f) { return a + (b - a) * f; }

(function loop() {
  requestAnimationFrame(loop);

  // Interpolate pose
  for (let k in targetPose) {
    if (typeof targetPose[k] === 'number') {
      currentPose[k] = lerp(currentPose[k] || 0, targetPose[k], 0.08);
    } else {
      currentPose[k] = targetPose[k];
    }
  }
  if (glbModel) applyPoseToGLB(currentPose);

  t += 0.014;

  // Pulse animation for selected muscle
  if (selectedMuscle && muscleMesh && muscleVertexColors && musclePositions) {
    const pulse = 0.7 + Math.sin(t * 3.5) * 0.3;
    const selRegions = MUSCLE_REGIONS[selectedMuscle];
    const selColor = MCOLS[selectedMuscle] || 0xff8844;
    const sr = ((selColor >> 16) & 0xFF) / 255;
    const sg = ((selColor >> 8) & 0xFF) / 255;
    const sb = (selColor & 0xFF) / 255;

    if (selRegions) {
      const count = musclePositions.length;
      for (let i = 0; i < count; i++) {
        const vx = musclePositions[i].x;
        const vy = musclePositions[i].y;
        const vz = musclePositions[i].z;
        const strength = getVertexMuscleStrength(vx, vy, vz, selRegions);
        if (strength > 0) {
          const intensity = pulse * (0.5 + strength * 0.5);
          muscleVertexColors.setXYZ(i, sr * intensity, sg * intensity, sb * intensity);
        }
      }
      muscleVertexColors.needsUpdate = true;
    }
  }

  root.rotation.y = rotY + Math.sin(t * 0.35) * 0.005;
  root.rotation.x = rotX;
  renderer.render(scene, camera);
})();
</script>
